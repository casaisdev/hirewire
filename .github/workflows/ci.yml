# CI — every push proves the bounty's own verification steps:
# pins resolve clean, typecheck + lint pass, the test suite (including LIVE
# integration against api.agenc.ag + attest.agenc.ag) passes, and the
# production build compiles.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (clean, respects package.json overrides)
        run: npm ci

      - name: Pins resolve inside the compatible matrix
        run: npm ls @tetsuo-ai/store-core @tetsuo-ai/marketplace-react @tetsuo-ai/marketplace-sdk

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests (unit + live API integration)
        run: npm test

      - name: Production build
        run: npm run build
